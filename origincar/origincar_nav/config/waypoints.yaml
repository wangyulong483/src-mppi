# ============================================================================
# 任务路点表 (map 坐标系)
# ----------------------------------------------------------------------------
# 来源: origincar_nav 手动导航实测 (log 运行于 2026-07-14 10:38)
#   起点        <- AMCL 初始位姿  "Setting pose: -1.985 -0.014 0.262"
#   任务发布点  <- 第1个导航目标  "... to (0.48, -3.16)"
#   (舍弃)      <- 第2个导航目标  "... to (0.28, -1.13)"   # 不重要, 未收录
#   黄色通道入口 <- 第3个导航目标 "... to (0.83, -1.03)"   # 朝向 = 初始位姿
#
# 用途: 供后续状态机 (nav2_simple_commander / BT) 逐点导航使用。
# 说明:
#   - yaw 单位为弧度; qz/qw 为等价的 z 轴四元数分量 (qx=qy=0)。
#   - 日志只记录导航目标的 (x, y)，不含朝向；任务发布点朝向为占位值，
#     需在真机按扫码需求校正 (见该项 verify 注释)。
# ============================================================================

frame_id: map

waypoints:
  # 1) 起点 / 初始位姿 (AMCL 设定, 带朝向)
  start:
    description: "起点 / 初始位姿"
    x: -1.985
    y: -0.014
    yaw: 0.262          # rad (~15.0°)
    qz: 0.130626
    qw: 0.991430

  # 2) 任务发布点 (二维码扫描点)
  task_publish_point:
    description: "任务发布点 (QR 扫描)"
    x: 0.48
    y: -3.16
    yaw: 0.262          # TODO(verify): 日志无朝向, 暂用初始朝向, 真机按扫码方向校正
    qz: 0.130626
    qw: 0.991430

  # 3) 黄色通道入口路点 (朝向与初始位姿一致)
  #    2026-07-19: 沿"起点为原点、起点朝向为y轴、⊥为x轴(第一象限, x轴=起点朝向-90°)"
  #    坐标系把入口沿 +x 微移 5cm(实际地图) → map (+0.0130,-0.0483) → (0.843,-1.078)。
  yellow_channel_entrance:
    description: "黄色通道入口 (朝向同初始位姿; +x 5cm 微偏)"
    x: 0.843
    y: -1.078
    yaw: 0.262          # 同初始位姿
    qz: 0.130626
    qw: 0.991430
